name: Cypress ServeRest

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Google Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get install -fy

      - name: Instalar dependências
        run: npm ci

      - name: Executar os cenários Cypress
        run: npm run test:e2e

      - name: Gerar o relatório Allure
        if: always()
        run: npm run allure:generate

      - name: Publicar o relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report
            allure-results
            cypress/screenshots
